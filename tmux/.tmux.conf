# easier prefix (optional but highly recommended)
set -g prefix C-k
unbind C-b
bind C-k send-prefix

# use vim-style keys in copy mode
setw -g mode-keys vi

# split panes using | and -
bind | split-window -h
bind - split-window -v

# reload config quickly
bind r source-file ~/.tmux.conf \; display-message "reloaded"

bind Tab last-window

# Make new windows from current dir by default
bind c new-window -c "#{pane_current_path}"

# Pass modified keys (shift+enter, etc.) through to applications.
# Ghostty sends CSI-u sequences; tmux drops them unless extended keys are on.
set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit

# tmux-agent-flag sets @agent while the agent in that window waits for input.
set -g window-status-format '#I:#W#{?@agent, ●,}#{?window_flags,#{window_flags}, }'
set-hook -g session-window-changed 'set -uw @agent'
